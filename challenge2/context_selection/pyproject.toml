[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-context-selection"
version = "0.1.0"
description = "Error-detected quantum context selection for a small language model (MidQWest 2026, Challenge 2)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "qiskit>=1.2",
    "qiskit-aer>=0.15",
    "scikit-learn>=1.3",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
superstaq = ["qiskit-superstaq>=0.5.40"]
llm = ["torch>=2.2", "transformers>=4.44", "sentence-transformers>=3.0", "accelerate>=0.33", "datasets>=2.20", "pandas>=2.0", "pyarrow>=15"]
onnx = ["onnxruntime>=1.18", "tokenizers>=0.19"]
physics = ["ARC-Alkali-Rydberg-Calculator>=3.9"]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: exhaustive or noisy-simulation checks that take more than a few seconds"]
